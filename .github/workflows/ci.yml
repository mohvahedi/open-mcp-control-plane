name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - run: gofmt -d -e . | tee /tmp/gofmt.diff && test ! -s /tmp/gofmt.diff
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build ./cmd/controlplane
