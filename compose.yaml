services:
  controlplane:
    build: .
    environment:
      OPENMCP_HOST: 0.0.0.0
      OPENMCP_PORT: 8080
      OPENMCP_VERSION: compose-dev
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 128m
    restart: unless-stopped
